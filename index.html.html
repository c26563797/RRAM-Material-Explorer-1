<body><header><h1>RRAM 天然／有機材料探索器</h1><p>正式文獻範圍：2022–2026 年（截至目前） · 主資料庫：70 種已觀察材料 · 物性研究 v1.1</p></header>
<div class="shell"><aside class="panel"><h2>篩選條件</h2><input id="q" class="search" placeholder="搜尋中文或英文材料名稱…">
<div class="group"><h3>資料母體</h3>
<label><input id="canonical" type="checkbox"> 只看 Formal 06 正式分析材料</label>
<label><input id="lab" type="checkbox"> 隱藏實驗室不可做材料</label>
<label><input id="unclear" type="checkbox"> 隱藏 RRAM 證據不明材料</label>
<label><input id="role" type="checkbox"> 隱藏角色不符合材料</label></div>
<div class="group"><h3>RRAM 證據等級</h3><div id="tiers"></div></div>
<div class="group"><h3>溶液／製程性質</h3>
<label>水溶性<select id="water"><option value="ANY">不限</option></select></label>
<label>醋酸溶解性<select id="acetic"><option value="ANY">不限</option></select></label>
<label>成膜性<select id="film"><option value="ANY">不限</option></select></label>
<label>旋轉塗佈（Spin coating）<select id="spin"><option value="ANY">不限</option></select></label>
<label>結晶傾向<select id="crystal"><option value="ANY">不限</option></select></label></div>
<div class="group"><h3>其他條件</h3>
<label>價格區間<select id="price"><option value="ANY">不限</option></select></label>
<label>酸鹼性<select id="acid"><option value="ANY">不限</option></select></label>
<label><input id="carb" type="checkbox"> 只看碳水化合物</label><label><input id="amino" type="checkbox"> 只看胺基酸</label></div>
<div class="group"><button id="reset">清除所有篩選</button></div><p class="small">RRAM 證據等級可複選（OR）；不同欄位之間為 AND。未知值不會被自動推論。</p></aside>
<main class="stage"><div class="toolbar"><div><h2>材料文字雲</h2><div id="stats" class="stats"></div></div><button id="all" class="primary">顯示全部</button></div><div id="cloud" class="cloud"></div>
<div class="legend">文字大小依 RRAM 研究篇數／主要研究篇數對數縮放；大小代表研究密度，不代表材料優劣。刪除線＝實驗室不可做；斜體＝僅 Step 07 稽核資料。點擊材料可開啟資訊卡。</div></main></div>
